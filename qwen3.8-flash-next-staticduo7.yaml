builder: docker-pull
cluster_only: false
command: |
  # Evict clean checkpoint pages from SparkRun's Hugging Face cache mount.
  python3 - <<'PY'
  import ctypes
  import os
  import pathlib

  libc = ctypes.CDLL(None)
  libc.posix_fadvise.argtypes = (ctypes.c_int, ctypes.c_int64, ctypes.c_int64, ctypes.c_int)
  libc.posix_fadvise.restype = ctypes.c_int
  dontneed = getattr(os, "POSIX_FADV_DONTNEED", 4)
  revision = "7b719225242aacd3dbd3f9407468c2ee9a9d2594"
  root = pathlib.Path(os.environ.get("HF_HUB_CACHE", "/cache/huggingface/hub"))
  snap = root / "models--RadixArk--Qwen3.8-Flash-Next-NVFP4" / "snapshots" / revision
  shards = list(snap.glob("*.safetensors"))
  if not shards:
      raise RuntimeError(f"checkpoint cache not found: {snap}")
  total = 0
  for path in shards:
      fd = os.open(path, os.O_RDONLY)
      try:
          size = os.fstat(fd).st_size
          error = libc.posix_fadvise(fd, 0, 0, dontneed)
          if error:
              raise OSError(error, os.strerror(error), str(path))
          total += size
      finally:
          os.close(fd)
  print(f"page-cache eviction advised for {len(shards)} shards ({total / 2**30:.1f} GiB)", flush=True)
  PY
  exec taskset -c 5-9,15-19 vllm serve {model} \
    --revision {revision} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --enable-expert-parallel \
    --all2all-backend allgather_reducescatter \
    --trust-remote-code \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --kv-cache-memory-bytes {kv_cache_memory_bytes} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --long-prefill-token-threshold 1024 \
    --kv-cache-dtype {kv_cache_dtype} \
    --mamba-ssm-cache-dtype {mamba_ssm_cache_dtype} \
    --enable-prefix-caching \
    --compilation-config '{{"mode":0,"cudagraph_mode":"FULL_DECODE_ONLY"}}' \
    --additional-config '{{"gdn_prefill_backend":"triton"}}' \
    --enable-flashinfer-autotune \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":{num_speculative_tokens},"index_share_for_mtp_iteration":true,"disable_eagle_block_drop":true,"use_local_argmax_reduction":true}}' \
    --enable-prompt-tokens-details \
    --kv-cache-metrics \
    --kv-cache-metrics-sample 1.0 \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --reasoning-parser qwen3
